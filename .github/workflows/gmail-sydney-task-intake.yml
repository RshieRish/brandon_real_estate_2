  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gmail-sydney-task-intake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  task1-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_CONTAINER: gmail-sydney-postgres
      POSTGRES_PORT: "55433"
      POSTGRES_USER: gmail_sydney_ci_fixture
      POSTGRES_PASSWORD: gmail_sydney_ci_fixture_only
      GMAIL_TASK_TEST_DATABASE_NAME: brandon_gmail_sydney_ci_test
      GMAIL_TASK_TEST_DATABASE_URL: postgresql+asyncpg://gmail_sydney_ci_fixture:gmail_sydney_ci_fixture_only@localhost:55433/brandon_gmail_sydney_ci_test?ssl=require
      DATABASE_URL: postgresql+asyncpg://gmail_sydney_ci_fixture:gmail_sydney_ci_fixture_only@localhost:55433/brandon_gmail_sydney_ci_test?ssl=require
      GMAIL_HISTORY_DATABASE_URL: postgresql+asyncpg://gmail_sydney_ci_fixture:gmail_sydney_ci_fixture_only@localhost:55433/brandon_gmail_sydney_ci_test?ssl=require
      GMAIL_PARTICIPANT_HASH_KEY: gmail-sydney-ci-participant-hash-key-only
      INTEGRATION_PROVIDER_SOCKET_TIMEOUT_SECONDS: "10"
      GOOGLE_WORKSPACE_CLIENT_ID: gmail-sydney-ci-client-id
      GOOGLE_WORKSPACE_CLIENT_SECRET: gmail-sydney-ci-client-secret-only
      GOOGLE_WORKSPACE_REDIRECT_URI: http://localhost:3000/api/v1/workspace/oauth/callback
      SSL_CERT_FILE: /tmp/gmail-sydney-postgres-tls/server.crt
      JWT_SECRET: gmail-sydney-ci-fixture-only
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt \
            "pytest==9.0.3" \
            "pytest-asyncio==1.3.0"

      - name: Guard the exact disposable database identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GMAIL_TASK_TEST_DATABASE_NAME" != *_test ]]; then
            echo "test database must end in _test" >&2
            exit 1
          fi
          url_database="$(python - <<'PY'
          import os
          from sqlalchemy.engine import make_url
          print(make_url(os.environ["GMAIL_TASK_TEST_DATABASE_URL"]).database)
          PY
          )"
          if [[ "$url_database" != "$GMAIL_TASK_TEST_DATABASE_NAME" ]]; then
            echo "database URL/name mismatch" >&2
            exit 1
          fi

      - name: Create fixture-only TLS certificate
        shell: bash
        run: |
          set -euo pipefail
          tls_directory="$(dirname "$SSL_CERT_FILE")"
          mkdir -p "$tls_directory"
          chmod 700 "$tls_directory"
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout "${SSL_CERT_FILE%.crt}.key" \
            -out "$SSL_CERT_FILE"
          chmod 600 "${SSL_CERT_FILE%.crt}.key"
          chmod 644 "$SSL_CERT_FILE"

      - name: Start isolated TLS PostgreSQL 16
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name "$POSTGRES_CONTAINER" \
            --publish "$POSTGRES_PORT:5432" \
            --env "POSTGRES_USER=$POSTGRES_USER" \
            --env "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" \
            --env "POSTGRES_DB=$GMAIL_TASK_TEST_DATABASE_NAME" \
            postgres:16-alpine
          for attempt in {1..30}; do
            if docker exec "$POSTGRES_CONTAINER" pg_isready \
              --username "$POSTGRES_USER" \
              --dbname "$GMAIL_TASK_TEST_DATABASE_NAME"; then break; fi
            if [[ "$attempt" -eq 30 ]]; then exit 1; fi
            sleep 1
          done
          docker cp "$SSL_CERT_FILE" "$POSTGRES_CONTAINER:/tmp/server.crt"
          docker cp "${SSL_CERT_FILE%.crt}.key" "$POSTGRES_CONTAINER:/tmp/server.key"
          docker exec --user root "$POSTGRES_CONTAINER" sh -euxc '
            cp /tmp/server.crt "$PGDATA/server.crt"
            cp /tmp/server.key "$PGDATA/server.key"
            chown postgres:postgres "$PGDATA/server.crt" "$PGDATA/server.key"
            chmod 0644 "$PGDATA/server.crt"
            chmod 0600 "$PGDATA/server.key"
          '
          docker exec "$POSTGRES_CONTAINER" psql --set ON_ERROR_STOP=1 \
            --username "$POSTGRES_USER" \
            --dbname "$GMAIL_TASK_TEST_DATABASE_NAME" \
            --command "ALTER SYSTEM SET ssl = 'on'"
          docker exec --user root "$POSTGRES_CONTAINER" sh -euxc '
            {
              echo "local all all trust"
              echo "hostssl all all 0.0.0.0/0 scram-sha-256"
              echo "hostssl all all ::/0 scram-sha-256"
              echo "hostnossl all all 0.0.0.0/0 reject"
              echo "hostnossl all all ::/0 reject"
            } > "$PGDATA/pg_hba.conf"
            chown postgres:postgres "$PGDATA/pg_hba.conf"
            chmod 0600 "$PGDATA/pg_hba.conf"
          '
          docker restart "$POSTGRES_CONTAINER"
          for attempt in {1..30}; do
            if docker exec "$POSTGRES_CONTAINER" pg_isready \
              --username "$POSTGRES_USER" \
              --dbname "$GMAIL_TASK_TEST_DATABASE_NAME"; then break; fi
            if [[ "$attempt" -eq 30 ]]; then exit 1; fi
            sleep 1
          done

      - name: Verify TLS
        run: |
          python - <<'PY'
          import os
          import psycopg2
          connection = psycopg2.connect(
              dbname=os.environ["GMAIL_TASK_TEST_DATABASE_NAME"],
              user=os.environ["POSTGRES_USER"],
              password=os.environ["POSTGRES_PASSWORD"],
              host="localhost",
              port=os.environ["POSTGRES_PORT"],
              sslmode="verify-full",
              sslrootcert=os.environ["SSL_CERT_FILE"],
          )
          try:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT ssl FROM pg_stat_ssl WHERE pid = pg_backend_pid()")
                  assert cursor.fetchone() == (True,)
          finally:
              connection.close()
          PY

      - name: Run the Task 1 through Task 6 persistence and compatibility contracts
        working-directory: backend
        run: |
          python -m pytest -q \
            tests/test_gmail_task_postgres_contract.py \
            tests/test_integration_runtime_migration.py \
            tests/test_integration_health_service.py \
            tests/test_notification_claims.py \
            tests/test_integration_worker.py \
            tests/test_integration_worker_deployment.py \
            tests/test_gmail_task_intake_migration.py \
            tests/test_gmail_history_adapter.py \
            tests/test_gmail_history_service.py \
            tests/test_gmail_history_cursor_recovery.py \
            tests/test_gmail_message_processing.py \
            tests/test_gmail_agent_control_origins.py \
            tests/test_workspace_oauth.py \
            tests/test_atlas_backend_mcp.py \
            tests/test_agent_control_workspace_actions.py \
            tests/test_agent_control_router.py \
            tests/test_workspace_actions.py \
            tests/test_gmail_task_extractor.py \
            tests/test_crm_task_suggestions.py \
            tests/test_sydney_task_review_migration.py \
            tests/test_sydney_clarifications.py \
            tests/test_sydney_telegram_dispatcher.py \
            tests/test_task_suggestion_approval.py \
            tests/test_gmail_task_intake_admin.py \
            tests/test_agent_control_crm.py \
            tests/test_agent_control_transactional_audit.py \
            tests/test_gmail_task_router_registration.py

      - name: Remove the exact disposable fixtures
        if: always()
        shell: bash
        run: |
          docker rm --force gmail-sydney-postgres 2>/dev/null || true
          rm -f -- "$SSL_CERT_FILE" "${SSL_CERT_FILE%.crt}.key"
          rmdir -- "$(dirname "$SSL_CERT_FILE")" 2>/dev/null || true

  task8-hermes-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install MCP overlay test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt "pytest==9.0.3"

      - name: Run the Task 8 MCP and overlay contract tests
        working-directory: backend
        run: python -m pytest -q tests/test_atlas_backend_mcp.py tests/test_hermes_overlay.py tests/test_verify_atlas_tools.py

  task7-command-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run the exact Task 7 Command review tests
        working-directory: frontend
        run: |
          npm test -- \
            src/lib/command/task-suggestions.test.ts \
            src/components/command/TaskSuggestionsWorkspace.test.tsx \
            src/components/command/shell/commandNavigation.test.ts \
            src/components/command/shell/CommandShell.test.tsx

      - name: Type-check the frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Lint only the Task 7 frontend scope
        working-directory: frontend
        run: |
          npm exec eslint -- \
            src/instrumentation-client.ts \
            src/proxy.ts \
            src/app/admin/layout.tsx \
            src/app/admin/command/task-suggestions/page.tsx \
            src/app/admin/login/page.tsx \
            src/lib/command/task-suggestion-handoff.ts \
            src/lib/command/task-suggestions.ts \
            src/lib/command/task-suggestions.test.ts \
            src/components/command/TaskSuggestionsWorkspace.tsx \
            src/components/command/TaskSuggestionsWorkspace.test.tsx \
            src/components/command/shell/commandNavigation.ts \
            src/components/command/shell/commandNavigation.test.ts \
            src/components/command/shell/CommandShell.test.tsx
