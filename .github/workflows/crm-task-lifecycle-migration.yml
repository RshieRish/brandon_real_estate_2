name: CRM task lifecycle migration

on:
  pull_request:
    paths:
      - "backend/alembic/**"
      - "backend/config.py"
      - "backend/database.py"
      - "backend/middleware/auth.py"
      - "backend/models/**"
      - "backend/routers/command.py"
      - "backend/schemas/command.py"
      - "backend/services/command_tasks.py"
      - "backend/services/crm_task_service.py"
      - "backend/tests/test_command_task_api.py"
      - "backend/tests/test_crm_task_lifecycle_migration.py"
      - "backend/tests/test_crm_task_service.py"
      - "backend/requirements.txt"
      - ".github/workflows/crm-task-lifecycle-migration.yml"
  push:
    branches:
      - main
    paths:
      - "backend/alembic/**"
      - "backend/config.py"
      - "backend/database.py"
      - "backend/middleware/auth.py"
      - "backend/models/**"
      - "backend/routers/command.py"
      - "backend/schemas/command.py"
      - "backend/services/command_tasks.py"
      - "backend/services/crm_task_service.py"
      - "backend/tests/test_command_task_api.py"
      - "backend/tests/test_crm_task_lifecycle_migration.py"
      - "backend/tests/test_crm_task_service.py"
      - "backend/requirements.txt"
      - ".github/workflows/crm-task-lifecycle-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-task-lifecycle-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-postgresql-migration:
    name: Real PostgreSQL migration chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # These credentials exist only inside this job's disposable test database.
      POSTGRES_CONTAINER: crm-task-lifecycle-postgres
      POSTGRES_PORT: "55432"
      POSTGRES_USER: crm_task_ci_fixture
      POSTGRES_PASSWORD: crm_task_ci_fixture_only
      CRM_TASK_TEST_DATABASE_NAME: brandon_crm_task_lifecycle_ci_test
      CRM_TASK_TEST_DATABASE_URL: postgresql+asyncpg://crm_task_ci_fixture:crm_task_ci_fixture_only@localhost:55432/brandon_crm_task_lifecycle_ci_test
      DATABASE_URL: postgresql+asyncpg://crm_task_ci_fixture:crm_task_ci_fixture_only@localhost:55432/brandon_crm_task_lifecycle_ci_test
      SSL_CERT_FILE: /tmp/crm-task-lifecycle-postgres-tls/server.crt
      JWT_SECRET: crm-task-lifecycle-ci-fixture-only
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt \
            "pytest==9.0.3" \
            "pytest-asyncio==1.3.0"

      - name: Create fixture-only TLS certificate
        shell: bash
        run: |
          set -euo pipefail
          tls_directory="$(dirname "$SSL_CERT_FILE")"
          mkdir -p "$tls_directory"
          chmod 700 "$tls_directory"
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout "${SSL_CERT_FILE%.crt}.key" \
            -out "$SSL_CERT_FILE"
          chmod 600 "${SSL_CERT_FILE%.crt}.key"
          chmod 644 "$SSL_CERT_FILE"

      - name: Start isolated TLS PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name "$POSTGRES_CONTAINER" \
            --publish "$POSTGRES_PORT:5432" \
            --env "POSTGRES_USER=$POSTGRES_USER" \
            --env "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" \
            --env "POSTGRES_DB=$CRM_TASK_TEST_DATABASE_NAME" \
            postgres:16-alpine

          for attempt in {1..30}; do
            if docker exec "$POSTGRES_CONTAINER" pg_isready \
              --username "$POSTGRES_USER" \
              --dbname "$CRM_TASK_TEST_DATABASE_NAME"; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo "PostgreSQL did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

          docker cp "$SSL_CERT_FILE" \
            "$POSTGRES_CONTAINER:/tmp/server.crt"
          docker cp "${SSL_CERT_FILE%.crt}.key" \
            "$POSTGRES_CONTAINER:/tmp/server.key"
          docker exec --user root "$POSTGRES_CONTAINER" sh -euxc '
            cp /tmp/server.crt "$PGDATA/server.crt"
            cp /tmp/server.key "$PGDATA/server.key"
            chown postgres:postgres "$PGDATA/server.crt" "$PGDATA/server.key"
            chmod 0644 "$PGDATA/server.crt"
            chmod 0600 "$PGDATA/server.key"
          '
          docker exec "$POSTGRES_CONTAINER" \
            psql --set ON_ERROR_STOP=1 \
              --username "$POSTGRES_USER" \
              --dbname "$CRM_TASK_TEST_DATABASE_NAME" \
              --command "ALTER SYSTEM SET ssl = 'on'"
          docker exec --user root "$POSTGRES_CONTAINER" sh -euxc '
            {
              echo "local all all trust"
              echo "hostssl all all 0.0.0.0/0 scram-sha-256"
              echo "hostssl all all ::/0 scram-sha-256"
              echo "hostnossl all all 0.0.0.0/0 reject"
              echo "hostnossl all all ::/0 reject"
            } > "$PGDATA/pg_hba.conf"
            chown postgres:postgres "$PGDATA/pg_hba.conf"
            chmod 0600 "$PGDATA/pg_hba.conf"
          '
          docker restart "$POSTGRES_CONTAINER"

          for attempt in {1..30}; do
            if docker exec "$POSTGRES_CONTAINER" pg_isready \
              --username "$POSTGRES_USER" \
              --dbname "$CRM_TASK_TEST_DATABASE_NAME"; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo "TLS PostgreSQL did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

      - name: Verify the database connection uses TLS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os

          import psycopg2

          connection = psycopg2.connect(
              dbname=os.environ["CRM_TASK_TEST_DATABASE_NAME"],
              user=os.environ["POSTGRES_USER"],
              password=os.environ["POSTGRES_PASSWORD"],
              host="localhost",
              port=os.environ["POSTGRES_PORT"],
              sslmode="verify-full",
              sslrootcert=os.environ["SSL_CERT_FILE"],
          )
          try:
              with connection.cursor() as cursor:
                  cursor.execute(
                      "SELECT ssl FROM pg_stat_ssl WHERE pid = pg_backend_pid()"
                  )
                  assert cursor.fetchone() == (True,)
          finally:
              connection.close()
          PY

      - name: Run the complete CRM task persistence contract
        working-directory: backend
        run: |
          python -m pytest -q \
            tests/test_crm_task_lifecycle_migration.py \
            tests/test_crm_task_service.py \
            tests/test_command_task_api.py

      - name: Remove the exact disposable fixtures
        if: always()
        shell: bash
        run: |
          docker rm --force crm-task-lifecycle-postgres 2>/dev/null || true
          rm -f -- "$SSL_CERT_FILE" "${SSL_CERT_FILE%.crt}.key"
          rmdir -- "$(dirname "$SSL_CERT_FILE")" 2>/dev/null || true
